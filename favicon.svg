<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra solida dura Neo-Brutalista -->
    <filter id="nb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Tarjeta Base .NET MAUI Purple (#512BD4) con borde duro 4px -->
  <rect x="6" y="6" width="112" height="112" rx="24" ry="24" fill="#512BD4" stroke="#000000" stroke-width="4.5" filter="url(#nb-shadow)"/>

  <!-- Brillo diagonal de profundidad superior -->
  <path d="M 8 36 C 40 24, 88 24, 116 36 L 116 28 C 116 16, 104 8, 92 8 L 30 8 C 18 8, 8 16, 8 28 Z" fill="#693DE8" opacity="0.6"/>

  <!-- SECCIÓN IZQUIERDA: .NET MAUI -->
  <g transform="translate(14, 22)">
    <!-- Texto .NET en blanco puro con sombra de borde -->
    <text x="0" y="32" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-1">.NET</text>
    
    <!-- Pill Badge 'MAUI' en verde menta fluorescente (#00E599) Neo-Brutalista -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="46" height="20" rx="5" ry="5" fill="#00E599" stroke="#000000" stroke-width="2"/>
      <text x="23" y="14.5" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle" letter-spacing="0.5">MAUI</text>
    </g>
  </g>

  <!-- SECCIÓN DERECHA: LOGO OFICIAL C# (Hexágono con C#) -->
  <g transform="translate(63, 24) scale(0.48)">
    <!-- Hexágono Superior C# (#9B4F96) -->
    <path fill="#9B4F96" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M115.4 30.7L67.1 2.9c-.8-.5-1.9-.7-3.1-.7-1.2 0-2.3.3-3.1.7l-48 27.9c-1.7 1-2.9 3.5-2.9 5.4v55.7c0 1.1.2 2.4 1 3.5l106.8-62c-.6-1.2-1.5-2.1-2.4-2.7z"/>
    <!-- Hexágono Inferior C# (#68217A) -->
    <path fill="#68217A" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M10.7 95.3c.5.8 1.2 1.5 1.9 1.9l48.2 27.9c.8.5 1.9.7 3.1.7 1.2 0 2.3-.3 3.1-.7l48-27.9c1.7-1 2.9-3.5 2.9-5.4V36.1c0-.9-.1-1.9-.6-2.8l-106.6 62z"/>
    <!-- Emblema Central 'C' y '#' -->
    <path fill="#FFFFFF" d="M85.3 76.1C81.1 83.5 73.1 88.5 64 88.5c-13.5 0-24.5-11-24.5-24.5s11-24.5 24.5-24.5c9.1 0 17.1 5 21.3 12.5l13-7.5c-6.8-11.9-19.6-20-34.3-20-21.8 0-39.5 17.7-39.5 39.5s17.7 39.5 39.5 39.5c14.6 0 27.4-8 34.2-19.8l-12.9-7.6zM97 66.2l.9-4.3h-4.2v-4.7h5.1L100 51h4.9l-1.2 6.1h3.8l1.2-6.1h4.8l-1.2 6.1h2.4v4.7h-3.3l-.9 4.3h4.2v4.7h-5.1l-1.2 6h-4.9l1.2-6h-3.8l-1.2 6h-4.8l1.2-6h-2.4v-4.7H97zm4.8 0h3.8l.9-4.3h-3.8l-.9 4.3z"/>
  </g>
</svg>
